name: rust-release-simple-windows

# 仅编译 Windows 二进制（原生/交叉编译，不签名、不打包安装包）。
# 风格对齐 rust-release-simple-macos.yml。
#
# 防内存 / 防超时的核心思路：
#   1. v8 crate 的 build.rs 会自动从 denoland/rusty_v8 releases 下载
#      预编译静态库（.lib），无需手动 setup（与 macOS/Linux 不同）。
#   2. 只编 --bin codex，不开 --all-features、不开 fat LTO。
#   3. Swatinem/rust-cache 缓存 target/，二次构建只跑增量。
#   4. 缓存恢复后清理 v8 构建产物，强制 build.rs 重新下载/解压静态库。

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

# libgit2 拉 git 子模块间歇性失败，改用系统 git CLI
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # ── 构建矩阵（x86_64 + aarch64）─────────────
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: codex-rs

    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64: windows-latest 原生编译
          - target: x86_64-pc-windows-msvc
            label: x86_64
          # aarch64: 在 x64 runner 上交叉编译
          - target: aarch64-pc-windows-msvc
            label: aarch64

    env:
      # workspace profile.release 默认 lto="fat" + codegen-units=4，是 OOM 元凶。
      # 改用 thin LTO + 16 codegen-units 降低内存峰值。
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          key: ${{ matrix.target }}

      # rust-cache 可能恢复了 v8 的 fingerprint 但未恢复实际的 .lib 静态库，
      # 导致 Cargo 跳过 build.rs、链接器找不到静态库。清理后强制重新下载。
      - name: Clean stale v8 build artifacts from cache
        shell: bash
        run: |
          set -uo pipefail
          target="${{ matrix.target }}"
          find "target/${target}/release/build" -maxdepth 1 -type d -name 'v8-*' -exec rm -rf {} + 2>/dev/null || true
          rm -rf "target/${target}/release/gn_out" 2>/dev/null || true
          echo "Cleaned stale v8 build artifacts (if any)"

      - name: Limit build jobs to avoid OOM
        shell: bash
        run: echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"

      # x86_64 需要 SQLITE_DISABLE_INTRINSIC，与官方 workflow 一致
      - name: Build release binary
        shell: bash
        env:
          LIBSQLITE3_FLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'SQLITE_DISABLE_INTRINSIC' || '' }}
        run: cargo build --release --target ${{ matrix.target }} --bin codex --timings

      - name: Prepare release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/codex.exe" "dist/codex-windows-${{ matrix.label }}.exe"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: codex-windows-${{ matrix.label }}
          path: codex-rs/dist/*

      # ── 组装 canonical package ──
      # daemon 首次启动要求完整包布局（codex-package.json +
      # bin/codex-code-mode-host.exe + codex-path/rg.exe +
      # codex-resources/codex-command-runner.exe 等），裸二进制会报
      # "this CLI has no complete local package"。--entrypoint-bin 复用上面
      # 编好的 codex.exe，只增量构建 helper crate 并下载 rg.exe。
      - name: Assemble canonical Codex package
        shell: bash
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python ../scripts/build_codex_package.py \
            --target "${{ matrix.target }}" \
            --cargo-profile release \
            --entrypoint-bin "target/${{ matrix.target }}/release/codex.exe" \
            --package-dir dist/package \
            --archive-output "dist/codex-package-${{ matrix.target }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: codex-package-${{ matrix.target }}
          path: codex-rs/dist/codex-package-${{ matrix.target }}.tar.gz

  # ── 发布（收集所有 Windows 产物）─────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: codex-windows-*
          merge-multiple: true

      # canonical package artifact 名字（codex-package-<target>）不匹配上面的
      # codex-windows-* pattern，单独下载。
      - name: Download canonical package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: codex-package-*
          merge-multiple: true

      # 为 canonical package 归档生成 sha256 sidecar，便于下载方校验。
      - name: Generate SHA256 sidecars for package archives
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for archive in codex-package-*.tar.gz; do
            [ -e "$archive" ] || continue
            sha256sum "$archive" > "$archive.sha256"
          done
          ls -la

      # tag 从 commit 时间推导（而不是当前时间）：三个平台的 release workflow
      # 对同一 commit 算出同一个 tag，共享同一个 Release，从而实现
      # releases/latest/download/<asset> 固定链接。
      - name: Set release version (commit-based)
        id: version
        run: |
          COMMIT_TS="$(git show -s --format=%ct "${GITHUB_SHA}")"
          VERSION="$(date -u -d "@${COMMIT_TS}" '+%Y%m%d-%H%M%S')"
          echo "version=codex-${VERSION}" >> "$GITHUB_OUTPUT"

      # create-if-missing + upload --clobber：三个平台的 release job 完成
      # 顺序不定，谁先到谁创建 Release，后面到的向同一 Release 追加资产。
      - name: Create or append to shared GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for attempt in 1 2 3 4 5; do
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                --title "$TAG" --notes "Commit ${GITHUB_SHA}" && break
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
              echo "release create raced; retrying (${attempt}/5)..."
              sleep $((attempt * 5))
            done
          fi
          gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
